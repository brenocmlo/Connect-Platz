version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: connect_platz_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platz_secure_db_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-connect_platz_crm}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-connect_platz_crm}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - connect_platz_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: connect_platz_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-platz_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-connect_platz_crm}?schema=public
      DIRECT_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-platz_secure_db_pass_2026}@postgres:5432/${POSTGRES_DB:-connect_platz_crm}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no .env}
      BCRYPT_SALT_ROUNDS: ${BCRYPT_SALT_ROUNDS:-12}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:?Defina META_VERIFY_TOKEN no .env}
      META_APP_SECRET: ${META_APP_SECRET:?Defina META_APP_SECRET no .env}
    env_file:
      - .env
    networks:
      - connect_platz_net

volumes:
  postgres_data:
    driver: local

networks:
  connect_platz_net:
    driver: bridge
