# ====================================================
# Configuração Nginx para Connect Platz (VPS Staging / Produção)
# Salvar em: /etc/nginx/sites-available/connect-platz
# Ativar com: sudo ln -s /etc/nginx/sites-available/connect-platz /etc/nginx/sites-enabled/
# ====================================================

# Redirecionamento HTTP -> HTTPS (descomente após gerar certificado com Certbot)
# server {
#     listen 80;
#     listen [::]:80;
#     server_name crm.seudominio.com.br;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    listen [::]:80;
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;

    server_name crm.seudominio.com.br; # Altere para o seu domínio ou deixe _ para IP

    # Certificados SSL (gerados via: sudo certbot --nginx -d crm.seudominio.com.br)
    # ssl_certificate /etc/letsencrypt/live/crm.seudominio.com.br/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/crm.seudominio.com.br/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;

    # Limite de upload para contratos, certidões e fotos de imóveis
    client_max_body_size 30M;

    # Otimização de Gzip
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache de arquivos estáticos Next.js imutáveis
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Proxy reverso principal da aplicação
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Suporte a WebSockets e SSE
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Cabeçalhos de rastreamento e segurança
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
